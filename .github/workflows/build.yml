name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege: this workflow only reads the repo. (Fork PRs are read-only
# regardless; this also covers branches pushed to this repo.)
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --filter TestCategory=unit

      - name: Publish
        run: dotnet publish

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: cgf-converter
          path: cgf-converter\bin\Release\net9.0\win-x64\publish
